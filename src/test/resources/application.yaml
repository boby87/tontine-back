spring:
  application:
    name: tontine-test
  threads:
    virtual:
      enabled: true

  # Testcontainers : un conteneur PostgreSQL ephemere est demarre automatiquement
  # grace au driver JDBC special de Testcontainers. Schema recree a chaque execution.
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///tontine_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  cors:
    allowed-origins:
      - http://localhost:4200
  jwt:
    secret: TestSecretKeyForUnitTestsOnly-Must-Be-32-Chars!!
    expiration-ms: 900000
  security:
    jwt:
      secret: TestSecretKeyForIntegrationTestsOnly-Must-Be-32-Chars!!
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 2592000
      issuer: tontine-connect-test
    bcrypt:
      strength: 4
  vote:
    anonymous-secret: test-vote-anonymous-secret

