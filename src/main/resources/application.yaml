spring:
  application:
    name: tontine

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:mem:tontine;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: 8080
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Security — JWT placeholders. En production, charger depuis un vault externe.
app:
  security:
    jwt:
      secret: "dev-only-secret-please-replace-with-a-strong-256-bit-key-managed-via-vault"
      access-token-ttl-seconds: 900       # 15 min
      refresh-token-ttl-seconds: 2592000  # 30 jours
      issuer: tontine-connect
    bcrypt:
      strength: 12
    otp:
      ttl-seconds: 300
      length: 6

logging:
  level:
    org.hibernate.SQL: INFO
    cm.ftg.tontine: DEBUG
