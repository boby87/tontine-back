spring:
  application:
    name: tontine

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tontine}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:tontine}
    password: ${DB_PASSWORD:tontine}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

  # Transport SMTP (Gmail par defaut). Identifiants via variables d'environnement :
  #   MAIL_USERNAME = adresse Gmail complete
  #   MAIL_PASSWORD = mot de passe d'application Google (2FA active, PAS le mot de passe du compte)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: 8081
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Security — JWT placeholders. En production, charger depuis un vault externe.
app:
  security:
    jwt:
      secret: "dev-only-secret-please-replace-with-a-strong-256-bit-key-managed-via-vault"
      access-token-ttl-seconds: 900       # 15 min
      refresh-token-ttl-seconds: 2592000  # 30 jours
      issuer: tontine-connect
    bcrypt:
      strength: 12
    otp:
      ttl-seconds: 300
      length: 6
  storage:
    backend: local
    max-file-size-bytes: 10485760  # 10 Mo
    local:
      root: ./uploads
  messaging:
    sms:
      provider: log   # log | twilio
      from-number: ""
      twilio:
        account-sid: ""
        auth-token: ""
    email:
      # log = ecrit dans les logs (dev) ; smtp = envoi reel via spring.mail.
      # En prod : APP_EMAIL_PROVIDER=smtp + MAIL_USERNAME/MAIL_PASSWORD.
      provider: ${APP_EMAIL_PROVIDER:log}   # log | smtp
      # Avec Gmail, l'expediteur doit etre l'adresse authentifiee (MAIL_USERNAME).
      from-address: ${MAIL_FROM:${MAIL_USERNAME:no-reply@tontine.local}}
      from-name: ${MAIL_FROM_NAME:Tontine Connect}
  presidency-transfer:
    # Duree de validite d'une proposition de transfert de presidence (heures).
    expiry-hours: 72
    max-pending-per-tontine: 1             # informatif (verrouille par index unique partiel)
    notification-channels: [IN_APP, SMS, EMAIL]
  invitation:
    # Duree de validite d'une invitation de membre (jours).
    expiry-days: 7
  frontend:
    # Base URL de l'app frontend, utilisee pour construire les liens d'acceptation.
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:4200}
  vote:
    # Secret stable servant au hash deterministe des bulletins anonymes
    # (SHA-256(voteId + memberId + secret)). NE JAMAIS changer apres deploiement
    # (les anciens hash deviendraient invalides). En prod : surcharger via la
    # variable d'environnement APP_VOTE_ANONYMOUS_SECRET (jamais committe).
    anonymous-secret: ${APP_VOTE_ANONYMOUS_SECRET:dev-only-vote-anonymous-secret-please-replace}
  mobile-money:
    provider: simulator   # simulator | mtn | orange
    webhook-secret: ""
    mtn:
      base-url: https://sandbox.momodeveloper.mtn.com
      subscription-key: ""
      api-user: ""
      api-key: ""
      target-environment: sandbox
      callback-url: ""
    orange:
      base-url: https://api.orange.com
      client-id: ""
      client-secret: ""
      merchant-key: ""
      callback-url: ""

logging:
  level:
    org.hibernate.SQL: INFO
    cm.ftg.tontine: INFO
